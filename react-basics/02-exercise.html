<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      function ProductDetails({ name, price, discountPrice, imageSrc }) {
        const productPrice = !discountPrice ? <p>Price: ${price}</p> : <del><p>Price: ${price}</p></del>;
        return (
          <div>
            <img src={imageSrc} width="80" />
            <p>{name}</p>
            {productPrice}
            {discountPrice && <p>Discount price: ${discountPrice}</p>}
            <button type="button">Add to Cart</button>
          </div>
        );
      }

      function LoginForm() {
        return (
          <>
            <p>Hello, welcome to my website</p>
            <div>
              <input type="text" placeholder="Email" />
            </div>
            <div>
              <input type="password" placeholder="Password" />
            </div>
            <button type="button">Login</button>
            <button type="button">Sign Up</button>
          </>
        );
      }

      function App() {
        return (
          <>
            <ProductDetails name="Cotton socks" price={10.90} discountPrice={5.45} imageSrc="./img/cotton-socks.png" />
            <ProductDetails name="Tennis balls" price={6.00} imageSrc="./img/tennis-balls.png" />
            <ProductDetails name="Plain T-Shirt" price={7.99} imageSrc="./img/plain-t-shirt.png" />
          </>
        );
      }

      const container = document.querySelector(".js-container");
      const root = ReactDOM.createRoot(container);
      root.render(<App />);
    </script>
  </body>
</html>
